name: Publish container image

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image-name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-name.outputs.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Export amd64 image archive
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.name }}
          TAG: ${{ github.ref_name }}
        run: |
          ARCHIVE_TAG="${TAG//\//-}"
          IMAGE="${IMAGE_NAME}:${TAG}"
          docker pull --platform linux/amd64 "$IMAGE"
          docker tag "$IMAGE" "midas_trigger:${ARCHIVE_TAG}-linux-amd64"
          docker save "midas_trigger:${ARCHIVE_TAG}-linux-amd64" | gzip > "midas_trigger-${ARCHIVE_TAG}-linux-amd64.tar.gz"

      - name: Export arm64 image archive
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.name }}
          TAG: ${{ github.ref_name }}
        run: |
          ARCHIVE_TAG="${TAG//\//-}"
          IMAGE="${IMAGE_NAME}:${TAG}"
          docker pull --platform linux/arm64 "$IMAGE"
          docker tag "$IMAGE" "midas_trigger:${ARCHIVE_TAG}-linux-arm64"
          docker save "midas_trigger:${ARCHIVE_TAG}-linux-arm64" | gzip > "midas_trigger-${ARCHIVE_TAG}-linux-arm64.tar.gz"

      - name: Create GitHub Release and upload image archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ARCHIVE_TAG="${TAG//\//-}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "midas_trigger-${ARCHIVE_TAG}-linux-amd64.tar.gz" \
              "midas_trigger-${ARCHIVE_TAG}-linux-arm64.tar.gz" \
              --clobber
          else
            gh release create "$TAG" \
              "midas_trigger-${ARCHIVE_TAG}-linux-amd64.tar.gz" \
              "midas_trigger-${ARCHIVE_TAG}-linux-arm64.tar.gz" \
              --title "$TAG" \
              --generate-notes
          fi
