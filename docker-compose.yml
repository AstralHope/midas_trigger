services:
  api-trigger:
    image: midas_trigger:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_script_trigger
    ports:
      - "9020:9020"
    environment:
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*,[::1]:*}"
      MCP_ALLOWED_ORIGINS: "${MCP_ALLOWED_ORIGINS:-}"
      LOG_DIR: /logs
    volumes:
      - ./scripts:/scripts
      - ./data:/data
      - ./logs:/logs
      - ./config.yaml:/app/config.yaml
      - ./keys.json:/app/keys.json
    restart: unless-stopped
